# Publishes this repo to GitHub Pages on every push to main, then asks Vercel
# to rebuild akrosecoestate.com so new articles get prerendered pages and a
# sitemap entry.
#
# One-time setup (see README.md):
#  - Settings → Pages → Source: "GitHub Actions"
#  - Settings → Secrets and variables → Actions → secret VERCEL_DEPLOY_HOOK_URL
name: Publish media

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; a newer push waits rather than cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The media files live in this subfolder of the repo.
    defaults:
      run:
        working-directory: akrosecoestate-media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: akrosecoestate-media/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: akrosecoestate-media/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Rebuild the website on Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL is not set; skipping the website rebuild."
          else
            curl -fsS -X POST "$HOOK" > /dev/null && echo "Vercel rebuild triggered."
          fi
